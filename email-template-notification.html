<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f7fa;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fa;padding:40px 20px">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.08)">
          
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#1e3a5f 0%,#2d5a87 100%);padding:40px 32px;text-align:center">
              <img src="https://prhinc-website.pages.dev/images/prhinclogo.png" alt="PRHInc" style="width:80px;height:80px;border-radius:50%;margin-bottom:16px;border:3px solid rgba(255,255,255,0.3)">
              <h1 style="color:#ffffff;margin:0;font-size:24px;font-weight:700;letter-spacing:0.5px">Palayan Recruitment Hub Inc.</h1>
              <p style="color:rgba(255,255,255,0.85);margin:8px 0 0;font-size:15px">Your Gateway to Career Opportunities</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 32px;color:#334155">
              <p style="font-size:16px;margin:0 0 8px">Dear <strong>{{name}}</strong>,</p>
              <div style="font-size:15px;line-height:1.8;color:#475569;white-space:pre-wrap">{{message}}</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f8fafc;padding:24px 32px;text-align:center;border-top:1px solid #e2e8f0">
              <p style="color:#64748b;font-size:13px;margin:0 0 8px">Palayan Recruitment Hub Inc.</p>
              <p style="color:#94a3b8;font-size:12px;margin:0">This is an automated message. Please do not reply directly to this email.</p>
            </td>
          </tr>
        </table>
        <p style="color:#94a3b8;font-size:12px;margin-top:24px">&copy; 2026 Palayan Recruitment Hub Inc. All rights reserved.</p>
      </td>
    </tr>
  </table>
</body>
</html>
