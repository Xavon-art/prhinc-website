<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRHInc - Manage Panel</title>
    <link rel="icon" type="image/png" href="images/prhinclogo.png">
    <link rel="stylesheet" href="css/manage.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="images/prhinclogo.png" alt="PRHInc Logo" class="login-logo">
            <h1>Manage Panel</h1>
            <p>PRHInc Management System</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" autocomplete="username">
            </div>
            
<div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" required="" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
                </div>
            </div>
            
            <button type="submit" class="btn-login">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                Sign In
            </button>
            
            <div id="loginError" class="error-message"></div>
        </form>
        
        <p class="back-link">
            <a href="index.html">← Back to PRHInc Website</a>
        </p>
    </div>

    <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const input = document.getElementById('password');
        const open = this.querySelector('.eye-open');
        const closed = this.querySelector('.eye-closed');
        if (input.type === 'password') {
            input.type = 'text';
            open.style.display = 'none';
            closed.style.display = 'block';
        } else {
            input.type = 'password';
            open.style.display = 'block';
            closed.style.display = 'none';
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const error = document.getElementById('loginError');
        const btn = this.querySelector('button');

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        error.textContent = '';

        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();
            if (data.success) {
                sessionStorage.setItem('prhinc_user', JSON.stringify(data.user));
                window.location.href = 'panel.html';
            } else {
                error.textContent = data.error || 'Invalid username or password';
            }
        } catch {
            error.textContent = 'Connection error. Try again.';
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg> Sign In`;
        }
    });

    if (sessionStorage.getItem('prhinc_user')) {
        window.location.href = 'panel.html';
    }
    </script>
</body>
</html>
