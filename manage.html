<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRHInc - Admin Login</title>
    <link rel="icon" type="image/png" href="images/prhinclogo.png">
    <link rel="stylesheet" href="css/manage.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="images/prhinclogo.png" alt="PRHInc Logo" class="login-logo">
            <h1>Admin Panel</h1>
            <p>PRHInc Management System</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                Sign In
            </button>
            
            <div id="loginError" class="error-message"></div>
        </form>
        
        <p class="back-link">
            <a href="index.html">← Back to PRHInc Website</a>
        </p>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const error = document.getElementById('loginError');
        const btn = this.querySelector('button');

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        error.textContent = '';

        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();
            if (data.success) {
                sessionStorage.setItem('prhinc_user', JSON.stringify(data.user));
                window.location.href = 'panel.html';
            } else {
                error.textContent = data.error || 'Invalid username or password';
            }
        } catch {
            error.textContent = 'Connection error. Try again.';
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg> Sign In`;
        }
    });

    if (sessionStorage.getItem('prhinc_user')) {
        window.location.href = 'panel.html';
    }
    </script>
</body>
</html>
